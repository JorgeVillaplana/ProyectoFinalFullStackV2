<div class="contact container">
  <div id="main-contact-form" class="container">
    <div class="row">
      <div class="col-md-5 mr-auto">
        <label for="main-contact-form" class="fs-3 fw-bolder">Contacto</label>
        <p class="mb-5">Bablabla, blablabla, mensaje random para los usuarios.</p>
        <ul class="list-unstyled pl-md-5 mb-5">
          <li class="d-flex text-black mb-2"><span class="mr-3"><span class="icon-phone"></span></span> (Opcional)
            Teléfono / dirección / email del admin</li>
        </ul>
      </div>
      <div class="col-md-6">
        <form class="mb-5" method="post" id="contactForm" name="contactForm">
          <div class="row">
            <div class="col-md-12 form-group">
              <label for="name" class="col-form-label">Nombre</label>
              <input type="text" class="form-control" name="name" id="name">
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 form-group">
              <label for="email" class="col-form-label">Email</label>
              <input type="text" class="form-control" name="email" id="email">
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 form-group">
              <label for="name" class="col-form-label">Teléfono</label>
              <input type="text" class="form-control" name="phone" id="phone">
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 form-group">
              <label for="message" class="col-form-label">Mensaje</label>
              <textarea class="form-control" name="message" id="message" cols="30" rows="7"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 text-center">
              <br><input type="submit" value="Enviar" class="btn btn-primary btn-lg">
              <span class="submitting"></span>
            </div>
          </div>
        </form>
