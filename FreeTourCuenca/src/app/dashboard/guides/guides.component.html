<div class="col-6 mt-4 guidelist">
    <h3>Listado de GUÍAS</h3>
    <ng-container>
        <ul class="list-group" *ngFor="let guide of guides; let position = index">
            <div class="d-flex justify-content-end">
                <li class="list-group-item">{{position+1}}. {{guide.name}} {{guide.surname}}</li>
                <button type="button" class="btn btn-success btn-sm" (click)="editMode()">Editar</button>
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteGuide(guide._id)">Eliminar</button>
            </div>
        </ul>
    </ng-container>
</div>



<button type="button" class="btn btn-warning" (click)='addGuide()'>Añadir nuevo guía</button>



<div class="guide-maker col-6" *ngIf="guideForm">
    <form [formGroup]="gForm" id="guidesForm">
        <div class="name form-group">
            <label for="name" class="col-form-label">Nombre</label>
            <input type="text" class="form-control" name="name" id="name">
        </div>
        <div class="surname form-group">
            <label for="surname" class="col-form-label">Apellido</label>
            <input type="text" class="form-control" name="surname" id="surname">
        </div>
        <div class="dni form-group">
            <label for="dni" class="col-form-label">DNI</label>
            <input type="text" class="form-control" name="dni" id="dni">
        </div>
        <div class="phone form-group">
            <label for="phone" class="col-form-label">Teléfono</label>
            <input type="number" class="form-control" name="phone" id="phone">
        </div>
        <div class="email form-group">
            <label for="email" class="col-form-label">Correo electrónico</label>
            <input type="email" class="form-control" name="email" id="email">
        </div>
        <div class="languages form-group">
            <label for="languages" class="col-form-label">Idiomas</label>
            <input type="text" class="form-control" name="languages" id="languages">
        </div>
        <div class="location form-group">
            <label for="city" class="col-form-label">Ciudad</label>
            <input type="text" class="form-control" name="city" id="city">
            <label for="state" class="col-form-label">Provincia</label>
            <input type="text" class="form-control" name="state" id="state">
            <label for="country" class="col-form-label">País</label>
            <input type="text" class="form-control" name="country" id="country">
        </div>
        <div class="d-flex justify-content-center">
            <button type="submit" (click)="submitForm()" class="btn btn-primary mt-3">Guardar guía</button>
        </div>
    </form>
</div>
