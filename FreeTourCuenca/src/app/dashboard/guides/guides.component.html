<div class="col-6 mt-4 guidelist">
  <h3>Listado de GUÍAS</h3>
  <ng-container>
    <ul class="list-group">
      <div class="d-flex justify-content-center" *ngFor="let guide of guides; let position = index">
        <li class="list-group-item">{{position+1}}. {{guide.name}} {{guide.surname}}</li>
        <button type="button" class="btn btn-success btn-sm" (click)="editMode(guide)">Editar</button>
        <button type="button" class="btn btn-danger btn-sm" (click)="deleteGuide(guide._id)">Eliminar</button>
      </div>
    </ul>
  </ng-container>
</div>



<button type="button" class="btn btn-warning" (click)='addGuide()'>Añadir nuevo guía</button>



<div class="guide-maker col-6" *ngIf="guideForm">
  <form [formGroup]="gForm" id="guidesForm" (keydown.enter)="$event.preventDefault()">
    <div class="name form-group">
      <label for="name" class="col-form-label">Nombre</label>
      <input type="text" class="form-control" formControlName="name" id="name">
    </div>
    <div class="surname form-group">
      <label for="surname" class="col-form-label">Apellido</label>
      <input type="text" class="form-control" formControlName="surname" id="surname">
    </div>
    <div class="dni form-group">
      <label for="dni" class="col-form-label">DNI</label>
      <input type="text" class="form-control" formControlName="dni" id="dni">
    </div>
    <div class="phone form-group">
      <label for="phone" class="col-form-label">Teléfono</label>
      <input type="number" class="form-control" formControlName="phone" id="phone">
    </div>
    <div class="email form-group">
      <label for="email" class="col-form-label">Correo electrónico</label>
      <input type="email" class="form-control" formControlName="email" id="email">
    </div>
    <div class="languages form-group">
      <label for="languages" class="col-form-label">Idiomas</label>
      <input type="text" class="form-control" formControlName="languages" id="languages" readonly
        [value]="languages.toString()" placeholder="Lista de idiomas:">
      <input type="text" class="form-control" #idioma (keyup.enter)="onEnter(idioma.value)"
        placeholder="Introduce idioma y pulsa Enter" />
    </div>
    <div class="location form-group">
      <label for="locations" class="col-form-label">Localidades</label>
      <input type="text" class="form-control" formControlName="locations" id="locations" readonly [value]="locations"
        placeholder="Lista de localidades:">
      <input type="text" class="form-control" formControlName="city" id="city" #city placeholder="Ciudad">
      <input type="text" class="form-control" formControlName="state" id="state" #state placeholder="Provincia">
      <input type="text" class="form-control" formControlName="country" id="country" #country placeholder="País">
      <button type="button" class="btn btn-success"
        (click)="newLocation(city.value, state.value, country.value)">Añadir</button>
    </div>
    <div class="d-flex justify-content-center">
      <button type="submit" (click)="submitForm()" class="btn btn-primary mt-3">Guardar guía</button>
    </div>
  </form>
</div>
