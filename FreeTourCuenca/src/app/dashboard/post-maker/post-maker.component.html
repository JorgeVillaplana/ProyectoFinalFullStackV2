<div class="col-9 mt-4 post">
    <h3>Crear publicación</h3>
    <form [formGroup]="pForm" id="postForm" (keydown.enter)="$event.preventDefault()">
        <div class="language form-group">
            <label for="language" class="col-form-label">Idioma de la publicación</label>
            <p>
                <select formControlName="language">
                <option *ngFor="let language of languages; index as i" [value]="i">{{language.name}}</option>
              </select>
            </p>
        </div>
        <div class="title form-group">
            <label for="title" class="col-form-label">Título de la publicación</label>
            <input type="text" class="form-control" formControlName="title" id="title" placeholder="Título del post">
        </div>
        <div class="text form-group">
            <label for="text" class="col-form-label">Texto del post</label>
            <textarea class="wysiwyg" class="form-control" [froalaEditor]="froalaOptions" formControlName="text" id="text"></textarea>
        </div>
        <div class="categories form-group ">
            <label for="categories" class="col-form-label">Categorías</label>
            <div class="input-group mb-3">
                <input type="text" class="form-control" formControlName="categories" id="categories" readonly [value]="categories.join(', ')" placeholder="Lista de categorías">
                <input type="text" class="form-control" #newCategory (keyup.enter)="addCategory(newCategory.value); newCategory.value=''" placeholder="Introduce categoría y pulsa Enter" />
                <button type="button" class="btn btn-outline-warning btn-sm" (click)="addCategory(newCategory.value); newCategory.value=''">Añadir</button>
            </div>
        </div>
        <div class="image form-group">
            <label for="image" class="col-form-label">Imagen</label>
            <input type="text" class="form-control" formControlName="route" id="route" placeholder="Enlace de la imagen">
            <input type="text" class="form-control" formControlName="detail" id="detail" placeholder="Descripción de la imagen">
        </div>
        <div class="important form-group">
            <input type="checkbox" id="important" formControlName="important">
            <label for="important">Post destacado</label><br>
        </div>
        <div class="facebook form-group">
          <input type="checkbox" id="facebook" formControlName="facebook">
          <label for="facebook">Publicar en Facebook</label><br>
      </div>
        <div class="d-flex justify-content-center">
            <button type="submit" (click)="savePost()" class="btn btn-outline-dark mt-3">Guardar publicación</button>
        </div>
    </form>
    <div *ngIf="alert" class="alert alert-success alert-dismissible fade show" role="alert">
        ¡Post creado correctamente!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div class="panel panel-primary" id="posts-panel">
    <div class="panel-heading">
        <h3 class="panel-title">Listado de posts</h3>
        <ul class="list-group">
            <div class="panel-body" *ngFor="let post of posts; index as position">
                <li class="list-group-item">{{position+1}}. {{post.details? post.details[0]?.title : ''}}
                  <button type="button" class="btn btn-danger btn-sm float-end" (click)="deletePost(post._id )">Eliminar</button>
                  <button type="button" class="btn btn-success btn-sm float-end" (click)="editPost()">Editar</button>
                </li>
            </div>
        </ul>
    </div>
</div>
