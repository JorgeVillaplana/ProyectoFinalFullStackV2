<div class="col-6 mt-4 userlist">
  <h3>Listado de USUARIOS</h3>
  <ng-container>
    <ul class="list-group" *ngFor="let user of users; let position = index">
      <div class="d-flex justify-content-end">
        <li class="list-group-item">{{position+1}}. {{user.name}} {{user.surname}} </li>
        <button type="button" class="btn btn-success btn-sm" (click)="editUser(user._id)">Editar</button>
        <button type="button" class="btn btn-danger btn-sm" (click)="deleteUser(user._id)">Eliminar</button>
      </div>
    </ul>
  </ng-container>
</div>

<button type="button" class="btn btn-warning" (click)='addUser()'>Añadir nuevo usuario</button>



<div class="user-maker col-6" *ngIf="userForm">
  <form [formGroup]="uForm" id="usersForm">
    <div class="email form-group">
      <label for="email" class="col-form-label">Correo electrónico</label>
      <input type="email" class="form-control" name="email" id="email">
    </div>
    <div class="name form-group">
      <label for="name" class="col-form-label">Nombre</label>
      <input type="text" class="form-control" name="name" id="name">
    </div>
    <div class="surname form-group">
      <label for="surname" class="col-form-label">Apellido</label>
      <input type="text" class="form-control" name="surname" id="surname">
    </div>
    <div class="password form-group">
      <label for="password" class="col-form-label">Contraseña</label>
      <input type="text" class="form-control" name="password" id="password">
    </div>

    <div class="role">
      <label for="role" class="col-form-label">Tipo de usario</label>
      <select id="role" name="roles">
        <option value="admin">Admin</option>
        <option value="editor">Editor</option>
        <option value="blogger">Bloguero</option>
        <option value="translator">Traductor</option>
      </select>
    </div>

    <div class="d-flex justify-content-center">
      <button type="submit" (click)="saveUser()" class="btn btn-primary mt-3">Guardar usuario</button>
    </div>
  </form>
</div>
