<div class="col-6 mt-4 userlist">
    <h3>Listado de USUARIOS</h3>
    <ng-container>
        <ul class="list-group" >
            <div class="d-flex justify-content-center" *ngFor="let user of users; let position = index">
                <li class="list-group-item">{{position+1}}. {{user.name}}</li>
                <button type="button" class="btn btn-success btn-sm" (click)="editMode(user)">Editar</button>
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteUser(user._id)">Eliminar</button>
            </div>
        </ul>
    </ng-container>
</div>

<button type="button" class="btn btn-warning" (click)='addUser()'>Añadir nuevo usuario</button>



<div class="user-maker col-6" *ngIf="userForm">
    <form [formGroup]="uForm" id="usersForm">
        <div class="email form-group">
            <label for="email" class="col-form-label">Correo electrónico</label>
            <input type="email" class="form-control" formControlName="email" id="email">
        </div>
        <div class="name form-group">
            <label for="name" class="col-form-label">Nombre</label>
            <input type="text" class="form-control" formControlName="name" id="name">
        </div>
        <div class="password form-group">
            <label for="password" class="col-form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password" id="password">
        </div>
        <div class="role">
            <label for="role" class="col-form-label">Tipo de usario</label>
            <select id="role" formControlName="role">
              <option value="admin">Admin</option>
              <option value="editor">Editor</option>
              <option value="blogger">Bloguero</option>
              <option value="translator">Traductor</option>
            </select>
        </div>

        <div class="d-flex justify-content-center">
            <button type="submit" (click)="submitForm()" class="btn btn-primary mt-3">Guardar usuario</button>
        </div>
    </form>
    <div *ngIf="alert" class="alert alert-success alert-dismissible fade show" role="alert">
      ¡Usuario guardado correctamente!
       <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
     </div>
</div>
