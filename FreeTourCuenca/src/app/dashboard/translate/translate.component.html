<div class="container-newlang">
  <h3>Añadir idioma</h3>
  <div class="row justify-content-md-center">
    <div class="col-inputs">
      <input type="text" name="langcode" placeholder="Código" maxlength="3">
      <input type="text" name="langname" placeholder="Nombre del idioma">
      <input type="text" name="icon" placeholder="Icono idioma (svg)">
    </div>
    <div class="text-center">
      <button type="button" class="btn btn-outline-info mt-4">Guardar</button>
    </div>
  </div>
</div>


<div class="container-main">
  <h3>Formulario textos</h3>
  <div class="container lang">
    <p>Seleccionar idioma</p>
    <select name="select">
      <option value="value1">Español</option>
      <option value="value2">English</option>
    </select>
  </div>

  <div class="container-table">
    <form [formGroup]="languageForm" id="newLanguageForm">
      <div class="form-group">
        <table>
          <thead>
            <tr>
              <th>CÓDIGOS</th>
              <th>IDIOMA PREDETERMINADO</th>
              <th>IDIOMA SELECCIONADO</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="text" name="code" placeholder="Códigos"></td>
              <td> <input type="text" name="name" placeholder="Idioma predeterminado"></td>
              <td><input type="text2" name="name2" placeholder="Idioma seleccionado"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>
    <div class="text-center">
      <button type="button" class="btn btn-outline-dark mt-4">Enviar</button>
    </div>
  </div>
