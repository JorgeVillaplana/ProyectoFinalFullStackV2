<div id="faq" class="jumbotron h-100">
    <div class="row justify-content-center h-100">
        <div class="col-2 left-image h-100"></div>
        <div class="col-8 h-100">
            <div class="container card faq h-100">
                <article>
                    <div class="header-content">
                        <header>
                            <h1 i18n="main header|faq" class="outstanding">Preguntas Frecuentes / FAQ</h1>
                        </header>
                    </div>
                    <div class="container-faq">
                        <div class="accordion">
                            <div class="accordion-item" *ngFor="let detail of faq.details; let i as ">
                                <h2 class="accordion-header" id="panelsStayOpen-headingOne">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true" aria-controls="panelsStayOpen-collapseOne">
                                  {{detail.question}}
                              </button>
                                </h2>
                                <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse" aria-labelledby="panelsStayOpen-headingOne">
                                    <div class="accordion-body" [innerHTML]="detail.answer">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="footer-content">
                        <footer>
                            <p i18n="bottom text|faq">¿No hemos solucionado tu duda?<br> Contacta con nosotros <a [routerLink]="['/contact']">aquí</a>.</p>
                        </footer>
                    </div>
                </article>
            </div>
        </div>
        <div class="col-2 right-image h-100"></div>
    </div>
</div>
