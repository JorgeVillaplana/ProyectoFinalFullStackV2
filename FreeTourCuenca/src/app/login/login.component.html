<div class="main-login container">
  <div class="row justify-content-center">
    <div class="col-4">

      <div class="row justify-content-center">
        <div class="col">
          <form id="login" [formGroup]="loginForm" (ngSubmit)="onLogin()">
            <div class="card">
              <div class="card-title">
                <h1>Accede a tu panel</h1>
              </div>
              <div class="form-floating">
                <input type="email" class="form-control" placeholder="name@example.com" id="email"
                  formControlName="email">
                <label for="email">Dirección Email</label>
              </div>
              <div class="form-floating">
                <input type="password" class="form-control" placeholder="Password" id="password"
                  formControlName="password">
                <label for="password">Contraseña</label>
              </div>
              <div class="alert alert-danger mt-4" role="alert"
                *ngIf="(login.email?.errors || login.password?.errors) && isSent">
                Email o contraseña no válidos
              </div>
              <button type="submit" class="btn mt-4 btn-primary">Acceder</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
